<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1700" viewBox="0 0 1800 1700">
<defs><linearGradient id="silver"><stop stop-color="#fff"/><stop offset=".45" stop-color="#8993aa"/><stop offset=".65" stop-color="#e8ecf3"/><stop offset="1" stop-color="#788297"/></linearGradient></defs>
<rect width="1800" height="1700" fill="#d9dde5"/><text x="60" y="65" font-family="Arial" font-size="30" fill="#151a24">Swapnil / Access in motion</text><text x="60" y="98" font-family="Arial" font-size="16" fill="#515a6c">Editable storyboard · Desktop + phone · Scroll, reveal, interact</text>
<g transform="translate(60 135)"><rect width="1170" height="660" rx="12" fill="#f3f4f6"/><text x="40" y="48" font-family="Arial" font-size="18">Swapnil Mukherjee</text><text x="790" y="48" font-family="Arial" font-size="15">Work      Projects      About      Contact</text><text x="40" y="120" font-family="Arial" font-size="14" fill="#616875">Identity engineer / Technical Consultant at Okta</text><text x="36" y="245" font-family="Arial" font-weight="700" font-size="112" letter-spacing="-7">Access to</text><text x="36" y="350" font-family="Arial" font-weight="700" font-size="112" letter-spacing="-7">what’s next.</text><text x="40" y="415" font-family="Arial" font-size="20" fill="#616875">I build identity systems for people,</text><text x="40" y="445" font-family="Arial" font-size="20" fill="#616875">applications, and AI agents.</text><rect x="40" y="490" width="190" height="50" rx="25" fill="#2445dc"/><text x="67" y="521" font-family="Arial" font-size="15" fill="white">Explore the work</text><g transform="translate(880 325) rotate(-25)"><ellipse rx="220" ry="245" fill="none" stroke="url(#silver)" stroke-width="25"/><ellipse rx="186" ry="207" fill="none" stroke="url(#silver)" stroke-width="25"/><ellipse rx="152" ry="169" fill="none" stroke="url(#silver)" stroke-width="25"/><ellipse rx="118" ry="131" fill="none" stroke="url(#silver)" stroke-width="25"/><ellipse rx="84" ry="93" fill="none" stroke="url(#silver)" stroke-width="25"/><ellipse rx="58" ry="65" fill="#2445dc"/><text x="0" y="12" text-anchor="middle" font-family="Arial" font-size="38" fill="white">+</text></g><text x="40" y="615" font-family="Arial" font-size="16" fill="#2445dc">Scroll to open the story ↓</text></g>
<g transform="translate(60 825)"><rect width="1170" height="650" rx="12" fill="#12151d"/><text x="45" y="60" font-family="Arial" font-size="15" fill="#cad7ff">A little trust goes a long way.</text><text x="45" y="170" font-family="Arial" font-weight="600" font-size="76" fill="white">People.</text><text x="45" y="265" font-family="Arial" font-weight="600" font-size="76" fill="#747e93">Applications.</text><text x="45" y="360" font-family="Arial" font-weight="600" font-size="76" fill="#747e93">AI agents.</text><g transform="translate(850 280)"><circle r="155" fill="none" stroke="#465373" stroke-width="2"/><circle r="120" fill="none" stroke="#2445dc" stroke-width="28"/><circle r="75" fill="#2445dc"/><text x="0" y="7" text-anchor="middle" font-family="Arial" font-size="22" fill="white">Access</text><circle cx="0" cy="-155" r="12" fill="#cad7ff"/><circle cx="145" cy="55" r="12" fill="#cad7ff"/></g><text x="45" y="460" font-family="Arial" font-size="21" fill="#aeb8cd">Different identities. Deliberate boundaries.</text><rect x="45" y="510" width="1080" height="90" rx="12" fill="#222b3e"/><text x="70" y="563" font-family="Arial" font-size="21" fill="white">Try an access check</text><rect x="860" y="530" width="235" height="48" rx="24" fill="#cad7ff"/><text x="891" y="560" font-family="Arial" font-size="16">Run the demonstration</text></g>
<g transform="translate(1270 135)"><rect width="450" height="940" rx="20" fill="#f3f4f6"/><text x="28" y="50" font-family="Arial" font-size="18">Swapnil</text><text x="389" y="50" font-size="24">☰</text><text x="26" y="165" font-family="Arial" font-weight="700" font-size="66" letter-spacing="-4">Access to</text><text x="26" y="230" font-family="Arial" font-weight="700" font-size="66" letter-spacing="-4">what’s next.</text><text x="28" y="290" font-family="Arial" font-size="17" fill="#616875">Identity for people, apps, and AI agents.</text><g transform="translate(225 535) rotate(-25)"><ellipse rx="157" ry="177" fill="none" stroke="url(#silver)" stroke-width="22"/><ellipse rx="124" ry="140" fill="none" stroke="url(#silver)" stroke-width="22"/><ellipse rx="91" ry="103" fill="none" stroke="url(#silver)" stroke-width="22"/><ellipse rx="58" ry="66" fill="none" stroke="url(#silver)" stroke-width="22"/><ellipse rx="35" ry="40" fill="#2445dc"/></g><text x="28" y="790" font-family="Arial" font-size="18">Touch-friendly. Native scroll.</text><text x="28" y="825" font-family="Arial" font-size="16" fill="#616875">No pinning on phone screens.</text></g><text x="1280" y="1135" font-family="Arial" font-size="23">Motion score</text><g font-family="Arial" font-size="17" fill="#515a6c"><text x="1280" y="1180">01 / Aperture opens with scroll</text><text x="1280" y="1220">02 / Identity chapters change</text><text x="1280" y="1260">03 / Local access-check demo</text><text x="1280" y="1300">04 / Projects come into perspective</text><text x="1280" y="1340">05 / Full-color personal portrait</text><text x="1280" y="1380">06 / Kinetic contact finale</text></g><text x="60" y="1545" font-family="Arial" font-size="22">Design principles</text><text x="60" y="1585" font-family="Arial" font-size="17" fill="#515a6c">Motion follows the story. One desktop pin. Every interaction works by keyboard. Reduced motion gets the complete content.</text><text x="60" y="1630" font-family="Arial" font-size="15" fill="#515a6c">Authored as editable SVG; importable into Figma. This is not a hosted Figma document.</text></svg>